name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Codex model fixture
        run: |
          mkdir -p "$HOME/.codex"
          printf '%s' '{"models":[{"slug":"codex-auto-review","display_name":"codex-auto-review"},{"slug":"gpt-5.5","display_name":"gpt-5.5"}]}' > "$HOME/.codex/models_cache.json"
      - run: npm run test:agents

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Take version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
